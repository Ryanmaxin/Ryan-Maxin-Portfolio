<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
  </head>
  <body>
    <script>
      (function () {
        var isContentPage = /^\/content\/?$/.test(window.location.pathname);
        var destination = isContentPage
          ? "/?route=content" + window.location.hash
          : "/";
        window.location.replace(destination);
      })();
    </script>
  </body>
</html>
