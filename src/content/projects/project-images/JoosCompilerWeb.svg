<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Joos compiler web interface cover art</title>
  <desc id="desc">An abstract compiler web interface showing source code and a compiler pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a27"/><stop offset="1" stop-color="#25233b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(115 105)">
    <rect width="970" height="490" rx="22" fill="#1d2532" stroke="#4e6582" stroke-width="2"/>
    <rect width="970" height="48" rx="22" fill="#29364a"/>
    <circle cx="34" cy="24" r="8" fill="#ff786f"/><circle cx="59" cy="24" r="8" fill="#f9c65b"/><circle cx="84" cy="24" r="8" fill="#66cf91"/>
    <rect x="24" y="74" width="405" height="388" rx="12" fill="#141b27"/>
    <text x="52" y="120" fill="#93b4d5" font-family="monospace" font-size="26">class Main {</text>
    <text x="75" y="166" fill="#f9c65b" font-family="monospace" font-size="25">public static</text>
    <text x="75" y="207" fill="#8ad1ff" font-family="monospace" font-size="25">int run() {</text>
    <text x="105" y="248" fill="#d9e3ee" font-family="monospace" font-size="25">return 42;</text>
    <text x="75" y="289" fill="#8ad1ff" font-family="monospace" font-size="25">}</text>
    <text x="52" y="332" fill="#93b4d5" font-family="monospace" font-size="26">}</text>
    <g transform="translate(490 104)">
      <g fill="#26384e" stroke="#73b8ff" stroke-width="2"><rect width="170" height="54" rx="11"/><rect y="96" width="170" height="54" rx="11"/><rect y="192" width="170" height="54" rx="11"/><rect y="288" width="170" height="54" rx="11"/></g>
      <g fill="#e3efff" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle"><text x="85" y="34">Tokenize</text><text x="85" y="130">Parse</text><text x="85" y="226">Typecheck</text><text x="85" y="322">Generate</text></g>
      <path d="M85 55v36m0 59v36m0 60v36" stroke="#73b8ff" stroke-width="4" stroke-linecap="round"/>
      <path d="m78 83 7 10 7-10m-14 96 7 10 7-10m-14 96 7 10 7-10" fill="none" stroke="#73b8ff" stroke-width="4"/>
    </g>
    <rect x="725" y="104" width="215" height="342" rx="12" fill="#151e2a"/>
    <text x="752" y="146" fill="#66cf91" font-family="monospace" font-size="20">Output</text>
    <path d="M752 175h144M752 205h110M752 235h150M752 265h94M752 310h140M752 340h125" stroke="#84a1be" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
