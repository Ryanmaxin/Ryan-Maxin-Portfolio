<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Joos compiler cover art</title>
  <desc id="desc">An abstract compiler pipeline transforming source code into assembly instructions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24192f"/><stop offset="1" stop-color="#0d2730"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <path d="M135 355h860" stroke="#76efd0" stroke-width="30" opacity=".14" filter="url(#glow)"/>
  <g font-family="monospace" font-weight="600" text-anchor="middle">
    <g transform="translate(125 210)"><rect width="205" height="280" rx="22" fill="#1b303a" stroke="#76efd0" stroke-width="3"/><text x="102" y="70" fill="#76efd0" font-size="32">JOOS</text><path d="M35 112h135M35 150h100M35 188h128M35 226h74" stroke="#c8f7ed" stroke-width="13" stroke-linecap="round"/></g>
    <g transform="translate(500 205)"><circle cx="145" cy="145" r="135" fill="#40255c" stroke="#d6a5ff" stroke-width="4"/><text x="145" y="135" fill="#f2e5ff" font-size="28">COMPILE</text><text x="145" y="174" fill="#d6a5ff" font-size="22">→</text></g>
    <g transform="translate(870 210)"><rect width="205" height="280" rx="22" fill="#172d37" stroke="#76efd0" stroke-width="3"/><text x="102" y="70" fill="#76efd0" font-size="30">x86</text><text x="102" y="117" fill="#bceee2" font-size="23">mov eax, 42</text><text x="102" y="160" fill="#bceee2" font-size="23">push ebp</text><text x="102" y="203" fill="#bceee2" font-size="23">call main</text></g>
  </g>
  <path d="M350 350h120m-28-25 28 25-28 25M790 350h45m-28-25 28 25-28 25" fill="none" stroke="#76efd0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
